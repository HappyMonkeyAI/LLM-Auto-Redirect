name: PHP tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  php-tests:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.3']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint plugin and regression test
        run: |
          php -l LLM_Auto_Redirect.php
          php -l tests/test-openai-compat.php

      - name: Run regression tests
        run: php tests/test-openai-compat.php
